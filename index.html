<body>

<!-- アプリを ひらいた ときに 3びょうだけ でる サクちゃんの しゃしん -->
<div class="splash" id="splash">
  <img src="saku.jpg" alt="サク">
  <p class="splash-title">サクのきもち</p>
</div>
<script>
(function(){
  "use strict";
  /* 声や写真の ページから もどってきた ときは、もう 出さない */
  var splash = document.getElementById("splash");
  var seen = false;
  try{
    seen = sessionStorage.getItem("saku-splash-seen") === "1";
    sessionStorage.setItem("saku-splash-seen", "1");
  }catch(e){}
  if(seen){
    splash.style.display = "none";
    splash.setAttribute("aria-hidden", "true");
    return;
  }
  setTimeout(function(){
    splash.classList.add("hide");
    setTimeout(function(){
      splash.style.display = "none";
      splash.setAttribute("aria-hidden", "true");
    }, 520);
  }, 3000);
})();
</script>
